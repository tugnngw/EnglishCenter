spring.application.name=EnglishCenter

# Server Configuration
server.port=8080

# Database Configuration - use postgres superuser
spring.datasource.url=jdbc:postgresql://localhost:5432/englishcenter
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration - use postgres superuser
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.user=postgres
spring.flyway.password=12345
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.validate-on-migrate=false

# Docker Compose (disable for direct PostgreSQL connection)
spring.docker.compose.enabled=false


