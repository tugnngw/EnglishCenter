services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: englishcenter-db
    environment:
      - 'POSTGRES_DB=englishcenter'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d englishcenter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - englishcenter-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishcenter-app
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/englishcenter'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=update'
      - 'SPRING_JPA_SHOW_SQL=true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - englishcenter-network

volumes:
  postgres_data:

networks:
  englishcenter-network:
    driver: bridge
